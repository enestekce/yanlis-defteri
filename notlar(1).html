<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>YKS Silkici Notlar</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<div class="box">
<h1>📝 Not Defteri</h1>
<input id="baslik" placeholder="Başlık"><br><br>
<textarea id="icerik" placeholder="Notunu yaz..." rows="6"></textarea><br>
<button onclick="ekle()">💾 Kaydet</button>
<div id="liste"></div>
</div>
</div>
<script>
let notlar=JSON.parse(localStorage.getItem("yksNotlar"))||[];
function goster(){
let l=document.getElementById("liste"); l.innerHTML="";
notlar.forEach((n,i)=>l.innerHTML+=`<div class="box"><h3>${n.baslik}</h3><p>${n.icerik}</p><button onclick="sil(${i})">🗑 Sil</button></div>`);
}
function ekle(){
let b=baslik.value.trim(),i=icerik.value.trim();
if(!b||!i)return;
notlar.push({baslik:b,icerik:i,tarih:new Date().toLocaleDateString("tr-TR")});
localStorage.setItem("yksNotlar",JSON.stringify(notlar));
baslik.value="";icerik.value="";goster();
}
function sil(i){notlar.splice(i,1);localStorage.setItem("yksNotlar",JSON.stringify(notlar));goster();}
goster();
</script>
</body>
</html>
