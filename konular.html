<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><title>Konu Takip</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container"><div class="box"><h1>📚 Maarif Konu Takip</h1>
<div id="konular"></div></div></div>
<script>
let konular=JSON.parse(localStorage.getItem("konular"))||[
["TYT Matematik","Problemler"],["TYT Geometri","Üçgenler"],["Fizik","Hareket"],["Kimya","Mol Kavramı"],["Biyoloji","Hücre"]
];
function goster(){let a=document.getElementById("konular");a.innerHTML="";
konular.forEach((k,i)=>{a.innerHTML+=`<div class="box"><h3>${k[0]}</h3><p>${k[1]}</p><button onclick="bitir(${i})">✅ Tamamlandı</button></div>`})}
function bitir(i){alert("Konu tamamlandı 💪")}
goster();
</script></body></html>
