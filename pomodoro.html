<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YKS Silkici - Pomodoro Merkezi</title>

<link rel="stylesheet" href="style.css">

<style>

position:fixed !important;

top:0 !important;
left:0 !important;

width:100vw !important;
height:100vh !important;

z-index:999999 !important;

background:#08111f !important;

display:flex !important;

flex-direction:column !important;

justify-content:center !important;

align-items:center !important;

padding:20px !important;

margin:0 !important;

box-sizing:border-box !important;

overflow:hidden !important;

}



.fullscreenBox h2{

font-size:40px !important;

margin-bottom:20px !important;

}
  .cikis{

display:none;

position:absolute;

right:20px;

top:20px;

width:45px;

height:45px;

border-radius:50%;

border:none;

background:#334155;

color:white;

font-size:28px;

z-index:999999;

}


.fullscreenBox .cikis{

display:block;

}
  
  




.fullscreenBox h1{

font-size:70px !important;

letter-spacing:3px !important;

font-weight:900 !important;

margin:15px !important;

}
  .fullscreenBox{

width:100% !important;

height:100% !important;

max-width:none !important;

}





.fullscreenBox button{

font-size:22px !important;

padding:15px 30px !important;

margin:8px !important;

}





.fullscreenBox select{

font-size:22px !important;

padding:10px !important;

margin:10px !important;

}




.fullscreenBox .buyut{

display:none !important;

}


/* büyütme butonu */

.buyut{

position:absolute;

right:15px;

top:15px;

width:45px;

height:40px;

padding:5px;

background:#334155;

}


.odak{

position:relative;

}


/* normal saat */
.buyukSaat{

font-size:70px;
letter-spacing:5px;
font-weight:800;

}


.fullscreenBox .buyukSaat{

font-size:70px !important;

}







.kartBaslik{

color:#94a3b8;

}


#kayitlar .card{

margin-top:15px;

}


</style>

</head>



<body>


<div class="container">



<h1>⏱️ YKS Silkici</h1>


<p class="subtitle">

Odaklan, çalış, ilerle.

</p>




<!-- SAAT -->

<div class="box odak" id="saatBox">


<button class="buyut" onclick="tamEkran('saatBox')">

⛶

</button>

  <button class="cikis" onclick="tamEkran('saatBox')">

×

</button>


<h2>🕒 Canlı Saat</h2>


<h1 id="saat" class="buyukSaat">

00:00:00

</h1>


<p id="tarih"></p>


</div>





<!-- POMODORO -->

<div class="box odak" id="pomBox">


<button class="buyut" onclick="tamEkran('pomBox')">

⛶

</button>
<button class="cikis" onclick="tamEkran('pomBox')">

×

</button>


<h2>🔥 Pomodoro</h2>


<select id="sure" onchange="pomSureDegisti()">


<option value="5">5 Dakika</option>

<option value="10">10 Dakika</option>

<option value="15">15 Dakika</option>

<option value="25" selected>25 Dakika</option>

<option value="30">30 Dakika</option>

<option value="45">45 Dakika</option>

<option value="60">60 Dakika</option>


</select>



<h1 id="pomodoro">

25:00

</h1>



<button onclick="baslat()">

▶ Başlat

</button>


<button onclick="durdur()">

⏸ Durdur

</button>


<button onclick="sifirla()">

🔄 Sıfırla

</button>


</div>


<!-- KRONOMETRE -->

<div class="box odak" id="kronoBox">


<button class="buyut" onclick="tamEkran('kronoBox')">

⛶

</button>
  
  <button class="cikis" onclick="tamEkran('kronoBox')">

×

</button>



<h2>⏲️ Kronometre</h2>


<h1 id="kronometre">

00:00:00

</h1>




<button onclick="kronoBaslat()">

▶ Başlat

</button>



<button onclick="kronoDurdur()">

⏸ Durdur

</button>



<button onclick="kronoSifirla()">

🔄 Sıfırla

</button>



<button onclick="kronoKaydet()">

💾 Çalışmayı Kaydet

</button>



</div>





<!-- İSTATİSTİK ÖZET -->

<div class="box">


<h2>📊 Bugünkü Çalışma</h2>


<div class="stats">


<div>

⏱️ Dakika

<br>

<b id="bugunDakika">

0

</b>

</div>




<div>

🔥 Pomodoro

<br>

<b id="pomSayisi">

0

</b>

</div>




<div>

📚 Toplam

<br>

<b id="toplamDakika">

0

</b>

</div>


</div>


</div>






<!-- KAYITLAR -->


<div class="box">


<h2>📅 Çalışma Geçmişi</h2>


<div id="kayitlar">

</div>


</div>





<button onclick="window.location.href='index.html'">

🏠 Ana Sayfa

</button>



</div>

<script>
// ==========================================
// 1. GENEL & TAM EKRAN İŞLEMLERİ
// ==========================================

function tamEkran(id) {
    let kutu = document.getElementById(id);
    kutu.classList.toggle("fullscreenBox");
}

// Bildirim izni isteği (Mobil ve PWA uyumu için)
if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
    Notification.requestPermission();
}

// ==========================================
// 2. CANLI SAAT
// ==========================================

function saatGuncelle() {
    let simdi = new Date();
    document.getElementById("saat").innerHTML = simdi.toLocaleTimeString("tr-TR");
    document.getElementById("tarih").innerHTML = simdi.toLocaleDateString("tr-TR");
}

// ==========================================
// 3. GELİŞMİŞ POMODORO SİSTEMİ (Arka Plan Destekli)
// ==========================================

let pomEnd = Number(localStorage.getItem("pomEnd")) || 0;
let pomSure = Number(localStorage.getItem("pomSure")) || 1500; // Saniye cinsinden
let pomTamamlandiMi = localStorage.getItem("pomTamamlandiMi") === "true";

// Pomodoro Süresi Değiştiğinde
function pomSureDegisti() {
    if (!pomEnd) {
        let secilenDk = Number(document.getElementById("sure").value);
        pomSure = secilenDk * 60;
        localStorage.setItem("pomSure", pomSure);
        gosterPom();
    }
}

function gosterPom() {
    let kalan;

    if (pomEnd) {
        // Bitiş zamanı üzerinden kalan saniyeyi hesapla
        kalan = Math.max(0, Math.ceil((pomEnd - Date.now()) / 1000));
        
        // Süre bittiğinde
        if (kalan === 0 && !pomTamamlandiMi) {
            pomTamamlandi();
        }
    } else {
        kalan = pomSure;
    }

    let dakika = Math.floor(kalan / 60);
    let saniye = kalan % 60;

    document.getElementById("pomodoro").innerHTML =
        String(dakika).padStart(2, "0") + ":" + String(saniye).padStart(2, "0");
}

function baslat() {
    if (pomTamamlandiMi) {
        sifirla();
    }
    
    if (!pomEnd) {
        // Şu anki zaman + kalan süre = Bitiş Zamanı
        pomEnd = Date.now() + pomSure * 1000;
        localStorage.setItem("pomEnd", pomEnd);
        pomTamamlandiMi = false;
        localStorage.setItem("pomTamamlandiMi", "false");
    }
    gosterPom();
}

function durdur() {
    if (pomEnd) {
        // Durdurulduğunda kalan süreyi hesapla ve kaydet
        pomSure = Math.max(0, Math.ceil((pomEnd - Date.now()) / 1000));
        localStorage.setItem("pomSure", pomSure);
        pomEnd = 0;
        localStorage.removeItem("pomEnd");
    }
    gosterPom();
}

function sifirla() {
    pomEnd = 0;
    localStorage.removeItem("pomEnd");
    
    pomTamamlandiMi = false;
    localStorage.setItem("pomTamamlandiMi", "false");

    let secilenDk = Number(document.getElementById("sure").value);
    pomSure = secilenDk * 60;
    localStorage.setItem("pomSure", pomSure);
    
    gosterPom();
}

function pomTamamlandi() {
    pomEnd = 0;
    localStorage.removeItem("pomEnd");
    pomSure = Number(document.getElementById("sure").value) * 60;
    localStorage.setItem("pomSure", pomSure);
    
    pomTamamlandiMi = true;
    localStorage.setItem("pomTamamlandiMi", "true");

    // Pomodoro sayısını artır
    pomSayisiArttir();

    // Sesli Uyarı
    sesCal();

    // Bildirim Gönder
    if ("Notification" in window && Notification.permission === "granted") {
        new Notification("YKS Silkici", {
            body: "🔥 Tebrikler! Bir Pomodoro oturumunu başarıyla tamamladın.",
            icon: "https://cdn-icons-png.flaticon.com/512/869/869636.png"
        });
    }

    setTimeout(function() {
        alert("🎉 Pomodoro Süresi Bitti! Harika bir çalışma çıkardın 💪");
    }, 100);
}

// Tamamlandığında basit bir bip sesi çıkarma fonksiyonu
function sesCal() {
    try {
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.value = 587.33; // D5 notası
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    } catch(e) {
        // Web Audio API desteklenmiyorsa veya kısıtlıysa sessiz geç
    }
}

// ==========================================
// 4. GELİŞMİŞ KRONOMETRE SİSTEMİ (Arka Plan Destekli)
// ==========================================

let kronoStart = Number(localStorage.getItem("kronoStart")) || 0;
let kronoSure = Number(localStorage.getItem("kronoSure")) || 0; // Biriken toplam saniye

function kronoGoster() {
    let toplam = kronoSure;

    if (kronoStart) {
        // Geçen süreyi milisaniyeden saniyeye çevirip ekle
        toplam += Math.floor((Date.now() - kronoStart) / 1000);
    }

    let saat = Math.floor(toplam / 3600);
    let dakika = Math.floor((toplam % 3600) / 60);
    let saniye = toplam % 60;

    document.getElementById("kronometre").innerHTML =
        String(saat).padStart(2, "0") + ":" +
        String(dakika).padStart(2, "0") + ":" +
        String(saniye).padStart(2, "0");
}

function kronoBaslat() {
    if (!kronoStart) {
        kronoStart = Date.now();
        localStorage.setItem("kronoStart", kronoStart);
    }
    kronoGoster();
}

function kronoDurdur() {
    if (kronoStart) {
        kronoSure += Math.floor((Date.now() - kronoStart) / 1000);
        kronoStart = 0;
        localStorage.removeItem("kronoStart");
        localStorage.setItem("kronoSure", kronoSure);
    }
    kronoGoster();
}

function kronoSifirla() {
    kronoStart = 0;
    kronoSure = 0;
    localStorage.removeItem("kronoStart");
    localStorage.removeItem("kronoSure");
    kronoGoster();
}

// ==========================================
// 5. ÇALIŞMA KAYDI VE İSTATİSTİK
// ==========================================

function kronoKaydet() {
    // Aktif çalışan kronometre varsa durdurup hesapla
    let kaydedilecekSure = kronoSure;
    if (kronoStart) {
        kaydedilecekSure += Math.floor((Date.now() - kronoStart) / 1000);
    }

    if (kaydedilecekSure === 0) {
        alert("Önce biraz çalışmalısın.");
        return;
    }

    let liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];
    let tarih = new Date().toLocaleDateString("tr-TR");

    liste.push({
        tarih: tarih,
        sure: kaydedilecekSure
    });

    localStorage.setItem("calismaKayitlari", JSON.stringify(liste));

    // Kronometreyi sıfırla
    kronoSifirla();

    alert("Çalışma kaydedildi 💪");

    kayitGoster();
    istatistikGuncelle();
}

function kayitGoster() {
    let alan = document.getElementById("kayitlar");
    let liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];

    alan.innerHTML = "";

    // Son eklenenler üstte gözüksün
    liste.slice().reverse().forEach(function(x, index) {
        let orjinalIndex = liste.length - 1 - index;
        let dakika = Math.floor(x.sure / 60);

        alan.innerHTML += `
            <div class="card">
                <p>📅 ${x.tarih}</p>
                <p>⏱️ ${dakika} dakika çalışıldı</p>
                <button onclick="kayitSil(${orjinalIndex})">🗑️ Sil</button>
            </div>
        `;
    });
}

function kayitSil(index) {
    let liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];
    liste.splice(index, 1);
    localStorage.setItem("calismaKayitlari", JSON.stringify(liste));

    kayitGoster();
    istatistikGuncelle();
}

function pomSayisiArttir() {
    let sayi = Number(localStorage.getItem("pomSayisi")) || 0;
    sayi++;
    localStorage.setItem("pomSayisi", sayi);
    istatistikGuncelle();
}

function istatistikGuncelle() {
    let liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];
    let bugun = new Date().toLocaleDateString("tr-TR");

    let toplam = 0;
    let bugunToplam = 0;

    liste.forEach(function(x) {
        let dakika = Math.floor(x.sure / 60);
        toplam += dakika;
        if (x.tarih === bugun) {
            bugunToplam += dakika;
        }
    });

    document.getElementById("bugunDakika").innerHTML = bugunToplam;
    document.getElementById("toplamDakika").innerHTML = toplam;
    document.getElementById("pomSayisi").innerHTML = localStorage.getItem("pomSayisi") || 0;
}

// ==========================================
// 6. ANA ZAMANLAYICI DÖNGÜSÜ VE ARKA PLAN SENKRONİZASYONU
// ==========================================

function genelDöngü() {
    saatGuncelle();
    gosterPom();
    kronoGoster();
}

// Ekranda 1 saniyelik aralıklarla güncelleme yap
setInterval(genelDöngü, 1000);

// Kullanıcı arka plandan uygulamaya geri döndüğünde zamanı anında eşitle
document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
        genelDöngü();
    }
});

window.addEventListener("focus", function() {
    genelDöngü();
});

// Sayfa ilk yüklendiğinde çalıştır
genelDöngü();
kayitGoster();
istatistikGuncelle();
</script>

</body>

</html>
