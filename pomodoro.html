<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YKS Silkici - Pomodoro Merkezi</title>

<link rel="stylesheet" href="style.css">

<style>
.fullscreenBox{

position:fixed !important;

top:0 !important;
left:0 !important;

width:100vw !important;
height:100vh !important;

z-index:999999 !important;

background:#08111f !important;

display:flex !important;

flex-direction:column !important;

justify-content:center !important;

align-items:center !important;

padding:20px !important;

margin:0 !important;

box-sizing:border-box !important;

overflow:hidden !important;

}



.fullscreenBox h2{

font-size:40px !important;

margin-bottom:20px !important;

}
  .cikis{

display:none;

position:absolute;

right:20px;

top:20px;

width:45px;

height:45px;

border-radius:50%;

border:none;

background:#334155;

color:white;

font-size:28px;

z-index:999999;

}


.fullscreenBox .cikis{

display:block;

}
  
  




.fullscreenBox h1{

font-size:70px !important;

letter-spacing:3px !important;

font-weight:900 !important;

margin:15px !important;

}
  .fullscreenBox{

width:100% !important;

height:100% !important;

max-width:none !important;

}





.fullscreenBox button{

font-size:22px !important;

padding:15px 30px !important;

margin:8px !important;

}





.fullscreenBox select{

font-size:22px !important;

padding:10px !important;

margin:10px !important;

}




.fullscreenBox .buyut{

display:none !important;

}


/* büyütme butonu */

.buyut{

position:absolute;

right:15px;

top:15px;

width:45px;

height:40px;

padding:5px;

background:#334155;

}


.odak{

position:relative;

}


/* normal saat */
.buyukSaat{

font-size:70px;
letter-spacing:5px;
font-weight:800;

}


.fullscreenBox .buyukSaat{

font-size:70px !important;

}







.kartBaslik{

color:#94a3b8;

}


#kayitlar .card{

margin-top:15px;

}


</style>

</head>



<body>


<div class="container">



<h1>⏱️ YKS Silkici</h1>


<p class="subtitle">

Odaklan, çalış, ilerle.

</p>




<!-- SAAT -->

<div class="box odak" id="saatBox">


<button class="buyut" onclick="tamEkran('saatBox')">

⛶

</button>

  <button class="cikis" onclick="tamEkran('saatBox')">

×

</button>


<h2>🕒 Canlı Saat</h2>


<h1 id="saat" class="buyukSaat">

00:00:00

</h1>


<p id="tarih"></p>


</div>





<!-- POMODORO -->

<div class="box odak" id="pomBox">


<button class="buyut" onclick="tamEkran('pomBox')">

⛶

</button>
<button class="cikis" onclick="tamEkran('pomBox')">

×

</button>


<h2>🔥 Pomodoro</h2>


<select id="sure">


<option value="5">5 Dakika</option>

<option value="10">10 Dakika</option>

<option value="15">15 Dakika</option>

<option value="25" selected>25 Dakika</option>

<option value="30">30 Dakika</option>

<option value="45">45 Dakika</option>

<option value="60">60 Dakika</option>


</select>



<h1 id="pomodoro">

25:00

</h1>



<button onclick="baslat()">

▶ Başlat

</button>


<button onclick="durdur()">

⏸ Durdur

</button>


<button onclick="sifirla()">

🔄 Sıfırla

</button>


</div>


<!-- KRONOMETRE -->

<div class="box odak" id="kronoBox">


<button class="buyut" onclick="tamEkran('kronoBox')">

⛶

</button>
  
  <button class="cikis" onclick="tamEkran('kronoBox')">

×

</button>



<h2>⏲️ Kronometre</h2>


<h1 id="kronometre">

00:00:00

</h1>




<button onclick="kronoBaslat()">

▶ Başlat

</button>



<button onclick="kronoDurdur()">

⏸ Durdur

</button>



<button onclick="kronoSifirla()">

🔄 Sıfırla

</button>



<button onclick="kronoKaydet()">

💾 Çalışmayı Kaydet

</button>



</div>





<!-- İSTATİSTİK ÖZET -->

<div class="box">


<h2>📊 Bugünkü Çalışma</h2>


<div class="stats">


<div>

⏱️ Dakika

<br>

<b id="bugunDakika">

0

</b>

</div>




<div>

🔥 Pomodoro

<br>

<b id="pomSayisi">

0

</b>

</div>




<div>

📚 Toplam

<br>

<b id="toplamDakika">

0

</b>

</div>


</div>


</div>






<!-- KAYITLAR -->


<div class="box">


<h2>📅 Çalışma Geçmişi</h2>


<div id="kayitlar">

</div>


</div>





<button onclick="window.location.href='index.html'">

🏠 Ana Sayfa

</button>



</div><script>


// TAM EKRAN

function tamEkran(id){

let kutu=document.getElementById(id);

kutu.classList.toggle("fullscreenBox");

}





// CANLI SAAT


function saatGuncelle(){

let simdi=new Date();


document.getElementById("saat").innerHTML =
simdi.toLocaleTimeString("tr-TR");


document.getElementById("tarih").innerHTML =
simdi.toLocaleDateString("tr-TR");


}


setInterval(saatGuncelle,1000);

saatGuncelle();









// POMODORO SİSTEMİ


let pomTimer=null;


let pomDakika =
Number(localStorage.getItem("pomDakika")) || 25;


let pomSaniye =
Number(localStorage.getItem("pomSaniye")) || 0;



let pomBaslangic =
Number(localStorage.getItem("pomBaslangic")) || null;





function gosterPom(){


document.getElementById("pomodoro").innerHTML =

String(pomDakika).padStart(2,"0")

+

":"

+

String(pomSaniye).padStart(2,"0");


}







function baslat(){


if(pomTimer) return;



if(!pomBaslangic){

pomBaslangic=Date.now();

localStorage.setItem(
"pomBaslangic",
pomBaslangic
);

}



pomTimer=setInterval(function(){


pomSaniye--;



if(pomSaniye<0){


pomSaniye=59;

pomDakika--;


}



if(pomDakika<=0 && pomSaniye<=0){


pomBitir();


return;


}





localStorage.setItem(
"pomDakika",
pomDakika
);



localStorage.setItem(
"pomSaniye",
pomSaniye
);



gosterPom();



},1000);



}







function durdur(){


clearInterval(pomTimer);


pomTimer=null;



}







function sifirla(){


durdur();


pomDakika =
Number(document.getElementById("sure").value);



pomSaniye=0;



localStorage.setItem(
"pomDakika",
pomDakika
);



localStorage.setItem(
"pomSaniye",
pomSaniye
);



gosterPom();



}






document
.getElementById("sure")
.addEventListener("change",function(){


pomDakika=Number(this.value);

pomSaniye=0;


gosterPom();


});





function pomBitir(){


clearInterval(pomTimer);


pomTimer=null;


localStorage.removeItem("pomBaslangic");



pomSayisiArttir();



let ses=new Audio(

"https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"

);



ses.play();



alert("Pomodoro tamamlandı 🔥");



pomDakika=
Number(document.getElementById("sure").value);



pomSaniye=0;


gosterPom();



}






gosterPom();


// KRONOMETRE SİSTEMİ


let kronoTimer=null;


let kronoSure =
Number(localStorage.getItem("kronoSure")) || 0;



function kronoGoster(){


let saat=Math.floor(kronoSure/3600);


let dakika=Math.floor((kronoSure%3600)/60);


let saniye=kronoSure%60;



document.getElementById("kronometre").innerHTML=


String(saat).padStart(2,"0")

+

":"

+

String(dakika).padStart(2,"0")

+

":"

+

String(saniye).padStart(2,"0");



}






function kronoBaslat(){


if(kronoTimer) return;



kronoTimer=setInterval(function(){


kronoSure++;


localStorage.setItem(
"kronoSure",
kronoSure
);


kronoGoster();



},1000);



}







function kronoDurdur(){


clearInterval(kronoTimer);


kronoTimer=null;



}







function kronoSifirla(){


kronoDurdur();


kronoSure=0;


localStorage.removeItem(
"kronoSure"
);


kronoGoster();


}








kronoGoster();










// ÇALIŞMA KAYDETME


function kronoKaydet(){


if(kronoSure===0){

alert("Önce biraz çalışmalısın.");

return;

}



let liste =

JSON.parse(
localStorage.getItem("calismaKayitlari")
)
|| [];



let tarih =
new Date().toLocaleDateString("tr-TR");




liste.push({

tarih:tarih,

sure:kronoSure


});





localStorage.setItem(

"calismaKayitlari",

JSON.stringify(liste)

);



alert("Çalışma kaydedildi 💪");



kayitGoster();


istatistikGuncelle();


}










// KAYITLARI GÖSTER


function kayitGoster(){


let alan=
document.getElementById("kayitlar");



let liste=

JSON.parse(
localStorage.getItem("calismaKayitlari")
)

|| [];



alan.innerHTML="";



  liste.slice().reverse().forEach(function(x,index){



let dakika=Math.floor(x.sure/60);



alan.innerHTML += `


<div class="card">


<p>📅 ${x.tarih}</p>


<p>⏱️ ${dakika} dakika çalışıldı</p>



<button onclick="kayitSil(${index})">

🗑️ Sil

</button>



</div>


`;



});



}








function kayitSil(index){


let liste=

JSON.parse(
localStorage.getItem("calismaKayitlari")
)

|| [];



liste.splice(index,1);



localStorage.setItem(

"calismaKayitlari",

JSON.stringify(liste)

);



kayitGoster();


istatistikGuncelle();


}



kayitGoster();

// POMODORO SAYACI


function pomSayisiArttir(){


let sayi =

Number(localStorage.getItem("pomSayisi"))
|| 0;



sayi++;



localStorage.setItem(
"pomSayisi",
sayi
);



istatistikGuncelle();


}









// İSTATİSTİK SİSTEMİ


function istatistikGuncelle(){


let liste =

JSON.parse(
localStorage.getItem("calismaKayitlari")
)

|| [];



let bugun =

new Date().toLocaleDateString("tr-TR");



let toplam=0;



liste.forEach(function(x){


let dakika=Math.floor(x.sure/60);


toplam+=dakika;



});






let bugunToplam=0;



liste.forEach(function(x){


if(x.tarih===bugun){


bugunToplam +=

Math.floor(x.sure/60);


}


});






document.getElementById("bugunDakika").innerHTML =

bugunToplam;



document.getElementById("toplamDakika").innerHTML =

toplam;



document.getElementById("pomSayisi").innerHTML =

localStorage.getItem("pomSayisi")
|| 0;



}







istatistikGuncelle();





</script>


</body>

</html>
