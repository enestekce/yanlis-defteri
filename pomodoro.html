<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YKS Silkici - Pomodoro</title>

<link rel="stylesheet" href="style.css">

<style>

.fullscreenBox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:999;
background:#08111f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.buyut{
position:absolute;
right:15px;
top:15px;
width:45px;
padding:8px;
background:#334155;
}

.odak{
position:relative;
}

</style>

</head>


<body>


<div class="container">


<h1>⏱️ Pomodoro Merkezi</h1>


<p class="subtitle">
Odaklan, çalış, ilerle.
</p>



<div class="box odak" id="saatBox">

<button class="buyut" onclick="tamEkran('saatBox')">⛶</button>

<h2>🕒 Canlı Saat</h2>

<h1 id="saat">
00:00:00
</h1>

<p id="tarih"></p>

</div>





<div class="box odak" id="pomBox">

<button class="buyut" onclick="tamEkran('pomBox')">⛶</button>

<h2>🔥 Pomodoro</h2>


<select id="sure">

<option value="10">10 Dakika</option>
<option value="15">15 Dakika</option>
<option value="25" selected>25 Dakika</option>
<option value="30">30 Dakika</option>
<option value="45">45 Dakika</option>
<option value="60">60 Dakika</option>

</select>


<h1 id="pomodoro">
25:00
</h1>



<button onclick="baslat()">
▶ Başlat
</button>


<button onclick="durdur()">
⏸ Durdur
</button>


<button onclick="sifirla()">
🔄 Sıfırla
</button>


</div>





<div class="box odak" id="kronoBox">

<button class="buyut" onclick="tamEkran('kronoBox')">⛶</button>


<h2>⏲️ Kronometre</h2>


<h1 id="kronometre">
00:00:00
</h1>



<button onclick="kronoBaslat()">
▶ Başlat
</button>


<button onclick="kronoDurdur()">
⏸ Durdur
</button>


<button onclick="kronoSifirla()">
🔄 Sıfırla
</button>


<button onclick="kronoKaydet()">
💾 Çalışmayı Kaydet
</button>


</div><div class="box">


<h2>📊 Bugünkü Çalışmalar</h2>


<div id="kayitlar">

</div>


</div>





<button onclick="window.location.href='index.html'">

🏠 Ana Sayfa

</button>



</div>






<script>


// tam ekran sistemi

function tamEkran(id){


let kutu=document.getElementById(id);


kutu.classList.toggle("fullscreenBox");


}







// canlı saat


function saatGuncelle(){


let simdi=new Date();


document.getElementById("saat").innerHTML=

simdi.toLocaleTimeString("tr-TR");



document.getElementById("tarih").innerHTML=

simdi.toLocaleDateString("tr-TR");


}



setInterval(saatGuncelle,1000);

saatGuncelle();









// pomodoro


let dakika =
Number(localStorage.getItem("pomDakika")) || 25;


let saniye =
Number(localStorage.getItem("pomSaniye")) || 0;


let pomTimer=null;




function baslat(){


if(pomTimer) return;


pomTimer=setInterval(function(){



if(saniye===0){


if(dakika===0){


clearInterval(pomTimer);

pomTimer=null;


alert("Pomodoro tamamlandı 🔥");


return;


}


dakika--;

saniye=59;


}else{


saniye--;


}



localStorage.setItem("pomDakika",dakika);

localStorage.setItem("pomSaniye",saniye);



gosterPom();


},1000);



}






function durdur(){


clearInterval(pomTimer);

pomTimer=null;


}






function sifirla(){


durdur();


dakika=
Number(document.getElementById("sure").value);


saniye=0;


gosterPom();


}






function gosterPom(){


document.getElementById("pomodoro").innerHTML=

dakika.toString().padStart(2,"0")

+

":"

+

saniye.toString().padStart(2,"0");


}



gosterPom();









// kronometre


let krono=

Number(localStorage.getItem("krono")) || 0;


let kronoTimer=null;






function kronoBaslat(){


if(kronoTimer) return;



kronoTimer=setInterval(function(){


krono++;


localStorage.setItem("krono",krono);


kronoGoster();



},1000);



}






function kronoDurdur(){


clearInterval(kronoTimer);

kronoTimer=null;


}






function kronoSifirla(){


kronoDurdur();


krono=0;


localStorage.removeItem("krono");


kronoGoster();


}






function kronoGoster(){



let saat=Math.floor(krono/3600);

let dakika=Math.floor((krono%3600)/60);

let saniye=krono%60;




document.getElementById("kronometre").innerHTML=

saat.toString().padStart(2,"0")

+

":"

+

dakika.toString().padStart(2,"0")

+

":"

+

saniye.toString().padStart(2,"0");


}



kronoGoster();







// çalışma kaydetme


function kronoKaydet(){


let liste=

JSON.parse(localStorage.getItem("calismaKayitlari")) || [];



let tarih=

new Date().toLocaleDateString("tr-TR");



liste.push({

tarih:tarih,

sure:krono

});




localStorage.setItem(

"calismaKayitlari",

JSON.stringify(liste)

);



alert("Çalışma kaydedildi 💪");


kayitGoster();


}








function kayitGoster(){


let alan=

document.getElementById("kayitlar");



let liste=

JSON.parse(localStorage.getItem("calismaKayitlari")) || [];



alan.innerHTML="";



liste.forEach(function(x,index){



let dakika=Math.floor(x.sure/60);



alan.innerHTML += `


<div class="card">


<p>📅 ${x.tarih}</p>

<p>⏱️ ${dakika} dakika</p>



<button onclick="kayitSil(${index})">

🗑️ Sil

</button>



</div>



`;



});



}






function kayitSil(index){



let liste=

JSON.parse(localStorage.getItem("calismaKayitlari")) || [];



liste.splice(index,1);



localStorage.setItem(

"calismaKayitlari",

JSON.stringify(liste)

);



kayitGoster();


}





kayitGoster();



</script>


</body>

</html>
