<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Silkici</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚀 YKS Silkici</h1>

        <p class="subtitle">
            Yanlışlarını analiz et, netlerini yükselt.
        </p>

        <div id="userSelect" class="box">
<!-- V4 kullanıcı alanı -->
            <h2>Kullanıcı seç</h2>
            <button onclick="giris('Enes')">
                👤 Enes
            </button>
            <button onclick="giris('Şahan')">
                👤 Şahan
            </button>
        <button onclick="window.location.href='notlar.html'">📝 Not Defteri</button></div>

        <div id="mainPanel" class="hidden">
<div class="v4Tabs">
<button onclick="location.href='konular.html'">📚 Konular</button>
<button onclick="location.href='notlar.html'">📝 Notlar</button>
<button onclick="location.href='denemeler.html'">📊 Denemeler</button>
<button onclick="location.href='pomodoro.html'">⏱ Pomodoro</button>
</div>

            <h2 id="hosgeldin"></h2>

            <div class="stats">
                <div class="statCard">
                    📚 Toplam Kayıt
                    <br>
                    <b id="toplam">0</b>
                </div>

                <div class="statCard">
                    ❌ Yanlış
                    <br>
                    <b id="yanlis">0</b>
                </div>

                <div class="statCard">
                    ⬜ Boş
                    <br>
                    <b id="bos">0</b>
                </div>

                <div class="statCard">
                    🔁 Tekrar
                    <br>
                    <b id="tekrar">0</b>
                </div>
            </div>

            <div class="box">
                <h2>📌 Menü</h2>
                <button onclick="git('yanlis-ekle.html')">
                    ➕ Yeni Soru Ekle
                </button>
                <button onclick="git('yanlislarim.html')">
                    📚 Yanlışlarım
                </button>
                <button onclick="git('istatistik.html')">
                    📊 İstatistik
                </button>
                <button onclick="git('program.html')">
                    📅 Çalışma Programı
                </button>
                <button onclick="git('denemeler.html')">
                    📝 Deneme Takibi
                </button>
                <button onclick="git('tekrar.html')">
                    🔁 Tekrar Merkezi
                </button>
                <button onclick="git('pomodoro.html')">
                    ⏱️ Pomodoro
                </button>
            </div>

            <div class="box">
                <h2>🎯 Günlük Görevler</h2>
                <p>
                    Bugünkü çalışma hedeflerini takip et.
                </p>
                <button onclick="gorevEkleAc()">
                    ➕ Yeni Görev Ekle
                </button>

                <div id="gorevEkleAlan" style="display:none;">
                    <input id="dersAdi" placeholder="Ders (Matematik, Fizik...)">
                    <input id="gorevTuru" placeholder="Tür (Soru, Video, Tekrar...)">
                    <input id="hedefMiktar" placeholder="Hedef sayı/dakika">
                    <input id="youtubeLink" placeholder="Youtube linki (opsiyonel)">
                    <button onclick="gorevKaydet()">
                        💾 Görevi Kaydet
                    </button>
                </div>

                <div id="gorevListesi"></div>
            </div>

        </div>

        <div class="box">
            <h2>🔥 YKS Silkici Durumu</h2>
            <p>
                Yanlışlarını azalt,
                eksiklerini kapat,
                netlerini yükselt.
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
