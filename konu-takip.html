<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><title>Konu Takip</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container"><div class="box"><h1>📚 Maarif Konu Takip</h1>
<div id="konular"></div></div></div>
<script>
const data={Matematik:["Sayılar","Problemler","Üçgenler","Fonksiyonlar"],Fizik:["Hareket","Kuvvet","Enerji"],Kimya:["Atom","Karışımlar","Tepkimeler"],Biyoloji:["Hücre","Kalıtım"]};
let key="konuDurum";let done=JSON.parse(localStorage.getItem(key)||"{}");
let el=document.getElementById("konular");
Object.keys(data).forEach(d=>{el.innerHTML+=`<h2>${d}</h2>`+data[d].map(x=>`<p><button onclick="tik('${x}')">${done[x]?'✅':'⬜'} ${x}</button></p>`).join("")});
function tik(x){done[x]=!done[x];localStorage.setItem(key,JSON.stringify(done));location.reload();}
</script></body></html>
