<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YKS Silkici - Pomodoro Merkezi</title>

<link rel="stylesheet" href="style.css">

<style>
/* Butonların tıklanabilirlik ayarları */
button {
    cursor: pointer !important;
    position: relative !important;
    z-index: 10 !important;
    pointer-events: auto !important;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
}

/* SAYAÇ VE METİN RENK İYİLEŞTİRMELERİ */
/* Canlı Saat, Pomodoro ve Kronometre dijital sayı renkleri */
#saat, #pomodoro, #kronometre, .buyukSaat {
    color: #38bdf8 !important; /* Parlak Açık Mavi / Turkuaz */
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.4) !important; /* Hafif gece parlaması */
    font-weight: 800 !important;
}

/* Başlıklar (Canlı Saat, Pomodoro, Kronometre h2 başlıkları) */
.box h2 {
    color: #f1f5f9 !important; /* Açık Parlak Beyaz/Gri */
    font-size: 24px;
}

/* Alt Açıklamalar ve Tarih */
#tarih, .subtitle, .kartBaslik {
    color: #94a3b8 !important; /* Açık Gri */
}

/* Tam Ekran Modu Stilleri */
.fullscreenBox {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 999999 !important;
    background: #08111f !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    padding: 20px !important;
    margin: 0 !important;
    box-sizing: border-box !important;
    overflow: hidden !important;
}

.fullscreenBox h2 {
    font-size: 36px !important;
    margin-bottom: 20px !important;
    color: #f1f5f9 !important;
}

.fullscreenBox h1, .fullscreenBox .buyukSaat {
    font-size: 80px !important;
    letter-spacing: 4px !important;
    font-weight: 900 !important;
    margin: 15px !important;
    color: #38bdf8 !important;
    text-shadow: 0 0 25px rgba(56, 189, 248, 0.6) !important;
}

.cikis {
    display: none;
    position: absolute;
    right: 20px;
    top: 20px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: #334155;
    color: white;
    font-size: 28px;
    z-index: 999999;
}

.fullscreenBox .cikis {
    display: block;
}

.fullscreenBox button {
    font-size: 22px !important;
    padding: 15px 30px !important;
    margin: 8px !important;
}

.fullscreenBox select {
    font-size: 22px !important;
    padding: 10px !important;
    margin: 10px !important;
}

.fullscreenBox .buyut {
    display: none !important;
}

/* Büyütme Butonu */
.buyut {
    position: absolute;
    right: 15px;
    top: 15px;
    width: 45px;
    height: 40px;
    padding: 5px;
    background: #334155;
    color: #fff;
    border: none;
    border-radius: 6px;
}

.odak {
    position: relative;
}

/* Normal Saat Boyutu */
.buyukSaat {
    font-size: 65px;
    letter-spacing: 4px;
    font-weight: 800;
}

#kayitlar .card {
    margin-top: 15px;
}
</style>

</head>

<body>

<div class="container">

<h1>⏱️ YKS Silkici</h1>

<p class="subtitle">
Odaklan, çalış, ilerle.
</p>

<!-- SAAT -->
<div class="box odak" id="saatBox">
    <button type="button" class="buyut" onclick="tamEkran('saatBox')">⛶</button>
    <button type="button" class="cikis" onclick="tamEkran('saatBox')">×</button>

    <h2>🕒 Canlı Saat</h2>
    <h1 id="saat" class="buyukSaat">00:00:00</h1>
    <p id="tarih"></p>
</div>

<!-- POMODORO -->
<div class="box odak" id="pomBox">
    <button type="button" class="buyut" onclick="tamEkran('pomBox')">⛶</button>
    <button type="button" class="cikis" onclick="tamEkran('pomBox')">×</button>

    <h2>🔥 Pomodoro</h2>

    <select id="sure" onchange="pomSureDegisti()">
        <option value="5">5 Dakika</option>
        <option value="10">10 Dakika</option>
        <option value="15">15 Dakika</option>
        <option value="25" selected>25 Dakika</option>
        <option value="30">30 Dakika</option>
        <option value="45">45 Dakika</option>
        <option value="60">60 Dakika</option>
    </select>

    <h1 id="pomodoro">25:00</h1>

    <button type="button" onclick="baslat()">▶ Başlat</button>
    <button type="button" onclick="durdur()">⏸ Durdur</button>
    <button type="button" onclick="sifirla()">🔄 Sıfırla</button>
</div>

<!-- KRONOMETRE -->
<div class="box odak" id="kronoBox">
    <button type="button" class="buyut" onclick="tamEkran('kronoBox')">⛶</button>
    <button type="button" class="cikis" onclick="tamEkran('kronoBox')">×</button>

    <h2>⏲️ Kronometre</h2>
    <h1 id="kronometre">00:00:00</h1>

    <button type="button" onclick="kronoBaslat()">▶ Başlat</button>
    <button type="button" onclick="kronoDurdur()">⏸ Durdur</button>
    <button type="button" onclick="kronoSifirla()">🔄 Sıfırla</button>
    <button type="button" onclick="kronoKaydet()">💾 Çalışmayı Kaydet</button>
</div>

<!-- İSTATİSTİK ÖZET -->
<div class="box">
    <h2>📊 Bugünkü Çalışma</h2>
    <div class="stats">
        <div>
            ⏱️ Dakika<br>
            <b id="bugunDakika">0</b>
        </div>
        <div>
            🔥 Pomodoro<br>
            <b id="pomSayisi">0</b>
        </div>
        <div>
            📚 Toplam<br>
            <b id="toplamDakika">0</b>
        </div>
    </div>
</div>

<!-- KAYITLAR -->
<div class="box">
    <h2>📅 Çalışma Geçmişi</h2>
    <div id="kayitlar"></div>
</div>

<button type="button" onclick="window.location.href='index.html'">🏠 Ana Sayfa</button>

</div>

<script>
// ==========================================
// 1. GENEL & TAM EKRAN İŞLEMLERİ
// ==========================================

function tamEkran(id) {
    try {
        var kutu = document.getElementById(id);
        if (kutu) {
            kutu.classList.toggle("fullscreenBox");
        }
    } catch(e) {
        console.error("Tam ekran hatasi:", e);
    }
}

// ==========================================
// 2. CANLI SAAT
// ==========================================

function saatGuncelle() {
    try {
        var simdi = new Date();
        var saatElem = document.getElementById("saat");
        var tarihElem = document.getElementById("tarih");
        if (saatElem) saatElem.innerText = simdi.toLocaleTimeString("tr-TR");
        if (tarihElem) tarihElem.innerText = simdi.toLocaleDateString("tr-TR");
    } catch(e) {}
}

// ==========================================
// 3. POMODORO SİSTEMİ
// ==========================================

var pomEnd = Number(localStorage.getItem("pomEnd")) || 0;
var pomSure = Number(localStorage.getItem("pomSure")) || 1500;
var pomTamamlandiMi = localStorage.getItem("pomTamamlandiMi") === "true";

function pomSureDegisti() {
    if (!pomEnd) {
        var selectElem = document.getElementById("sure");
        if (selectElem) {
            var secilenDk = Number(selectElem.value) || 25;
            pomSure = secilenDk * 60;
            localStorage.setItem("pomSure", pomSure);
            gosterPom();
        }
    }
}

function gosterPom() {
    var kalan;

    if (pomEnd > 0) {
        kalan = Math.max(0, Math.ceil((pomEnd - Date.now()) / 1000));
        if (kalan === 0 && !pomTamamlandiMi) {
            pomTamamlandi();
            return;
        }
    } else {
        kalan = pomSure > 0 ? pomSure : 1500;
    }

    var dakika = Math.floor(kalan / 60);
    var saniye = kalan % 60;

    var pomElem = document.getElementById("pomodoro");
    if (pomElem) {
        pomElem.innerText =
            String(dakika).padStart(2, "0") + ":" + String(saniye).padStart(2, "0");
    }
}

function baslat() {
    try {
        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission().catch(function(){});
        }
    } catch(e) {}

    if (pomTamamlandiMi) {
        sifirla();
    }
    
    if (!pomEnd) {
        var selectElem = document.getElementById("sure");
        if ((!pomSure || pomSure <= 0) && selectElem) {
            pomSure = (Number(selectElem.value) || 25) * 60;
        }
        pomEnd = Date.now() + pomSure * 1000;
        localStorage.setItem("pomEnd", pomEnd);
        pomTamamlandiMi = false;
        localStorage.setItem("pomTamamlandiMi", "false");
    }
    gosterPom();
}

function durdur() {
    if (pomEnd > 0) {
        pomSure = Math.max(0, Math.ceil((pomEnd - Date.now()) / 1000));
        localStorage.setItem("pomSure", pomSure);
        pomEnd = 0;
        localStorage.removeItem("pomEnd");
    }
    gosterPom();
}

function sifirla() {
    pomEnd = 0;
    localStorage.removeItem("pomEnd");
    
    pomTamamlandiMi = false;
    localStorage.setItem("pomTamamlandiMi", "false");

    var selectElem = document.getElementById("sure");
    var secilenDk = selectElem ? (Number(selectElem.value) || 25) : 25;
    pomSure = secilenDk * 60;
    localStorage.setItem("pomSure", pomSure);
    
    gosterPom();
}

function pomTamamlandi() {
    pomEnd = 0;
    localStorage.removeItem("pomEnd");
    
    var selectElem = document.getElementById("sure");
    pomSure = (selectElem ? (Number(selectElem.value) || 25) : 25) * 60;
    localStorage.setItem("pomSure", pomSure);
    
    pomTamamlandiMi = true;
    localStorage.setItem("pomTamamlandiMi", "true");

    pomSayisiArttir();
    sesCal();

    try {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification("YKS Silkici", {
                body: "🔥 Tebrikler! Bir Pomodoro oturumunu başarıyla tamamladın."
            });
        }
    } catch(e) {}

    setTimeout(function() {
        alert("🎉 Pomodoro Süresi Bitti! Harika bir çalışma çıkardın 💪");
    }, 100);
}

function sesCal() {
    try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
            var audioCtx = new AudioCtx();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = "sine";
            osc.frequency.value = 587.33;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }
    } catch(e) {}
}

// ==========================================
// 4. KRONOMETRE SİSTEMİ
// ==========================================

var kronoStart = Number(localStorage.getItem("kronoStart")) || 0;
var kronoSure = Number(localStorage.getItem("kronoSure")) || 0;

function kronoGoster() {
    var toplam = kronoSure;

    if (kronoStart > 0) {
        toplam += Math.floor((Date.now() - kronoStart) / 1000);
    }

    var saat = Math.floor(toplam / 3600);
    var dakika = Math.floor((toplam % 3600) / 60);
    var saniye = toplam % 60;

    var kronoElem = document.getElementById("kronometre");
    if (kronoElem) {
        kronoElem.innerText =
            String(saat).padStart(2, "0") + ":" +
            String(dakika).padStart(2, "0") + ":" +
            String(saniye).padStart(2, "0");
    }
}

function kronoBaslat() {
    if (!kronoStart) {
        kronoStart = Date.now();
        localStorage.setItem("kronoStart", kronoStart);
    }
    kronoGoster();
}

function kronoDurdur() {
    if (kronoStart > 0) {
        kronoSure += Math.floor((Date.now() - kronoStart) / 1000);
        kronoStart = 0;
        localStorage.removeItem("kronoStart");
        localStorage.setItem("kronoSure", kronoSure);
    }
    kronoGoster();
}

function kronoSifirla() {
    kronoStart = 0;
    kronoSure = 0;
    localStorage.removeItem("kronoStart");
    localStorage.removeItem("kronoSure");
    kronoGoster();
}

// ==========================================
// 5. ÇALIŞMA KAYDI VE İSTATİSTİK
// ==========================================

function kronoKaydet() {
    var kaydedilecekSure = kronoSure;
    if (kronoStart > 0) {
        kaydedilecekSure += Math.floor((Date.now() - kronoStart) / 1000);
    }

    if (kaydedilecekSure === 0) {
        alert("Önce biraz çalışmalısın.");
        return;
    }

    var liste = [];
    try {
        liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];
    } catch(e) {
        liste = [];
    }
    
    var tarih = new Date().toLocaleDateString("tr-TR");

    liste.push({
        tarih: tarih,
        sure: kaydedilecekSure
    });

    localStorage.setItem("calismaKayitlari", JSON.stringify(liste));

    kronoSifirla();

    alert("Çalışma kaydedildi 💪");

    kayitGoster();
    istatistikGuncelle();
}

function kayitGoster() {
    var alan = document.getElementById("kayitlar");
    if (!alan) return;

    var liste = [];
    try {
        liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];
    } catch(e) {
        liste = [];
    }

    alan.innerHTML = "";

    liste.slice().reverse().forEach(function(x, index) {
        var orjinalIndex = liste.length - 1 - index;
        var dakika = Math.floor(x.sure / 60);

        alan.innerHTML += `
            <div class="card">
                <p>📅 ${x.tarih}</p>
                <p>⏱️ ${dakika} dakika çalışıldı</p>
                <button type="button" onclick="kayitSil(${orjinalIndex})">🗑️ Sil</button>
            </div>
        `;
    });
}

function kayitSil(index) {
    var liste = [];
    try {
        liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];
    } catch(e) {}
    
    liste.splice(index, 1);
    localStorage.setItem("calismaKayitlari", JSON.stringify(liste));

    kayitGoster();
    istatistikGuncelle();
}

function pomSayisiArttir() {
    var sayi = Number(localStorage.getItem("pomSayisi")) || 0;
    sayi++;
    localStorage.setItem("pomSayisi", sayi);
    istatistikGuncelle();
}

function istatistikGuncelle() {
    var liste = [];
    try {
        liste = JSON.parse(localStorage.getItem("calismaKayitlari")) || [];
    } catch(e) {}

    var bugun = new Date().toLocaleDateString("tr-TR");

    var toplam = 0;
    var bugunToplam = 0;

    liste.forEach(function(x) {
        var dakika = Math.floor(x.sure / 60);
        toplam += dakika;
        if (x.tarih === bugun) {
            bugunToplam += dakika;
        }
    });

    var bDakikaElem = document.getElementById("bugunDakika");
    var tDakikaElem = document.getElementById("toplamDakika");
    var pSayisiElem = document.getElementById("pomSayisi");

    if (bDakikaElem) bDakikaElem.innerText = bugunToplam;
    if (tDakikaElem) tDakikaElem.innerText = toplam;
    if (pSayisiElem) pSayisiElem.innerText = localStorage.getItem("pomSayisi") || 0;
}

// ==========================================
// 6. DÖNGÜ VE ARKA PLAN SENKRONİZASYONU
// ==========================================

function genelDongu() {
    saatGuncelle();
    gosterPom();
    kronoGoster();
}

setInterval(genelDongu, 1000);

document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
        genelDongu();
    }
});

window.addEventListener("focus", function() {
    genelDongu();
});

// Sayfa açılışında çalıştır
genelDongu();
kayitGoster();
istatistikGuncelle();
</script>

</body>

</html>
